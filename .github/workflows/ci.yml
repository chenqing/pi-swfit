name: Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and test
        # Timing-sensitive cancellation/retry fixtures should not compete with 1,000+ tests.
        run: swift test --no-parallel
      - name: CLI integration (offline fixtures)
        run: python3 scripts/smoke-cli.py
      - name: Build release CLI
        run: swift build -c release --product pf
